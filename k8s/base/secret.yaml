# Secret estático (não ExternalSecret) — MongoDB in-cluster (infra/k8s/base/mongodb.yaml)
# roda sem autenticação (mesma escolha do mecanica-infra-ms), então a URI não
# carrega credencial real. Decisão registrada em
# infra/k8s/base/external-secret.yaml: workshop-service-secret fica aqui, não
# no ExternalSecret do repo infra.
apiVersion: v1
kind: Secret
metadata:
  name: workshop-service-secret
type: Opaque
stringData:
  mongodb-uri: mongodb://mecanica-mongodb:27017/workshop_service
