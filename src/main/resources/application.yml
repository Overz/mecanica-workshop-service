spring:
  application:
    name: workshop-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/workshop_service}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    virtual-host: /

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        url: "${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}"
        step: 60s
        aggregation-temporality: cumulative
    tracing:
      endpoint: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}"
  tracing:
    sampling:
      probability: "${OTEL_SAMPLING_PROBABILITY:1.0}"
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      defaults:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    secret-key: ${SECURITY_JWT_SECRET_KEY:ZGV2U2VjcmV0S2V5Rm9yTG9jYWxEZXZlbG9wbWVudE9ubHkzMkJ5dGVz}

seeding:
  enabled: ${SEEDING_ENABLED:true}
